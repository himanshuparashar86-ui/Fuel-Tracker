  <style>
    :root {
      --navy: #0F172A;
      --navy-mid: #1E293B;
      --teal: #0D9488;
      --teal-dark: #0F766E;
      --teal-soft: #CCFBF1;
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;

      --orange: #EA580C;
      --orange-soft: #FFEDD5;
      --red: #DC2626;
      --red-soft: #FEE2E2;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: calc(84px + var(--safe-bottom));
      min-height: 100vh;
      overscroll-behavior-y: contain;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: #FFFFFF;
      padding: calc(14px + var(--safe-top)) 16px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.18);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(13, 148, 136, 0.22);
      border: 1px solid rgba(45, 212, 191, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5EEAD4;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22C55E;
    }
